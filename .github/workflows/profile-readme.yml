name: Update Profile README Widgets

# NOTE: Kept on manual trigger only for now — this GitHub account currently
# has an Actions billing lock ("account is locked due to a billing issue"),
# so push/schedule triggers would just pile up failed runs. Once billing is
# resolved, re-add `push`/`schedule` triggers and switch the README's
# GitHub Analytics section back to the self-hosted /profile/*.svg cards and
# the `output`-branch snake animation for a fully self-hosted, rate-limit-free
# setup.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Renders GitHub Stats + Top Languages as static SVGs (dark + light) and
  # commits them to /profile on main. Self-hosted via GitHub Actions so the
  # cards no longer depend on the shared, rate-limited public
  # github-readme-stats.vercel.app instance at README render time.
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=default&hide_border=true
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=default&hide_border=true
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: update profile stats cards"
          git push

  # Renders the animated contribution "snake" (dark + light) and publishes
  # it to a dedicated `output` branch, per Platane/snk's standard pattern.
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
